name: flowlink

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_OAUTH_BASE_URL: ${NEXT_PUBLIC_OAUTH_BASE_URL:-}
        NEXT_PUBLIC_KAKAO_MAP_JS_KEY: ${NEXT_PUBLIC_KAKAO_MAP_JS_KEY:-}
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
    networks:
      - flowlink
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.10}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-flowlink_access_token}
      AUTH_INSECURE_HTTP_HOSTS: ${AUTH_INSECURE_HTTP_HOSTS:-}
      ALLOWED_FRONTEND_ORIGINS: ${ALLOWED_FRONTEND_ORIGINS:-}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_PROJECT_ID: ${ROBOFLOW_PROJECT_ID:-}
      ROBOFLOW_MODEL_VERSION: ${ROBOFLOW_MODEL_VERSION:-}
      UPLOAD_DIR: /app/uploads
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      OAUTH_BACKEND_BASE_URL: ${OAUTH_BACKEND_BASE_URL:?Set OAUTH_BACKEND_BASE_URL}
      AI_SERVICE_URL: http://backend-ai:8001
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?Set AI_INTERNAL_API_KEY}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-30}
      AI_VIDEO_SERVICE_TIMEOUT_SECONDS: ${AI_VIDEO_SERVICE_TIMEOUT_SECONDS:-300}
      USER_IMAGE_SOURCE_MAX_BYTES: ${USER_IMAGE_SOURCE_MAX_BYTES:-20971520}
      USER_IMAGE_SOURCE_MAX_PIXELS: ${USER_IMAGE_SOURCE_MAX_PIXELS:-50000000}
      USER_IMAGE_NORMALIZED_MAX_EDGE: ${USER_IMAGE_NORMALIZED_MAX_EDGE:-2560}
      USER_IMAGE_NORMALIZED_TARGET_BYTES: ${USER_IMAGE_NORMALIZED_TARGET_BYTES:-4194304}
      USER_IMAGE_NORMALIZED_HARD_MAX_BYTES: ${USER_IMAGE_NORMALIZED_HARD_MAX_BYTES:-5242880}
      USER_VIDEO_MAX_BYTES: ${USER_VIDEO_MAX_BYTES:-104857600}
      USER_VIDEO_MAX_DURATION_SECONDS: ${USER_VIDEO_MAX_DURATION_SECONDS:-30}
      USER_VIDEO_MAX_SOURCE_EDGE: ${USER_VIDEO_MAX_SOURCE_EDGE:-4096}
      USER_VIDEO_NORMALIZED_MAX_WIDTH: ${USER_VIDEO_NORMALIZED_MAX_WIDTH:-1920}
      USER_VIDEO_NORMALIZED_MAX_HEIGHT: ${USER_VIDEO_NORMALIZED_MAX_HEIGHT:-1080}
      USER_VIDEO_NORMALIZED_MAX_FPS: ${USER_VIDEO_NORMALIZED_MAX_FPS:-30}
      USER_VIDEO_FFPROBE_TIMEOUT_SECONDS: ${USER_VIDEO_FFPROBE_TIMEOUT_SECONDS:-20}
      USER_VIDEO_FFMPEG_TIMEOUT_SECONDS: ${USER_VIDEO_FFMPEG_TIMEOUT_SECONDS:-180}
      USER_IMAGE_ROLLING_24H_LIMIT: ${USER_IMAGE_ROLLING_24H_LIMIT:-50}
      USER_VIDEO_ROLLING_24H_LIMIT: ${USER_VIDEO_ROLLING_24H_LIMIT:-5}
      USER_MEDIA_STORAGE_LIMIT_BYTES: ${USER_MEDIA_STORAGE_LIMIT_BYTES:-1073741824}
      USER_ACTIVE_VIDEO_JOB_LIMIT: ${USER_ACTIVE_VIDEO_JOB_LIMIT:-1}
      CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      COPILOT_TIMEOUT_SECONDS: ${COPILOT_TIMEOUT_SECONDS:-30}
      COPILOT_RATE_LIMIT_WINDOW_SECONDS: ${COPILOT_RATE_LIMIT_WINDOW_SECONDS:-60}
      COPILOT_GUEST_RATE_LIMIT: ${COPILOT_GUEST_RATE_LIMIT:-10}
      COPILOT_USER_RATE_LIMIT: ${COPILOT_USER_RATE_LIMIT:-30}
      COPILOT_ADMIN_RATE_LIMIT: ${COPILOT_ADMIN_RATE_LIMIT:-60}
      COPILOT_MAX_OUTPUT_TOKENS: ${COPILOT_MAX_OUTPUT_TOKENS:-1200}
      COPILOT_PROVIDER_COOLDOWN_SECONDS: ${COPILOT_PROVIDER_COOLDOWN_SECONDS:-30}
    volumes:
      - flowlink_uploads:/app/uploads
    depends_on:
      backend-ai:
        condition: service_healthy
    networks:
      - flowlink
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-ai:
    build:
      context: ./backend-ai
    expose:
      - "8001"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: "8001"
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?Set AI_INTERNAL_API_KEY}
      BACKEND_INTERNAL_URL: http://backend:8000
      DETECTION_MODEL: ${DETECTION_MODEL:?Set DETECTION_MODEL to a registered model path}
      DETECTION_CONFIDENCE: ${DETECTION_CONFIDENCE:-0.25}
      DETECTION_IMGSZ: ${DETECTION_IMGSZ:-640}
      TRACK_MIN_APPEARANCES: ${TRACK_MIN_APPEARANCES:-3}
      TRACK_MIN_DURATION_MS: ${TRACK_MIN_DURATION_MS:-500}
      TRACK_MIN_MEDIAN_CONFIDENCE: ${TRACK_MIN_MEDIAN_CONFIDENCE:-0.5}
      TRACK_MIN_DENSITY: ${TRACK_MIN_DENSITY:-0.5}
      TRACK_MIN_DOMINANT_CLASS_RATIO: ${TRACK_MIN_DOMINANT_CLASS_RATIO:-0.7}
      WEBCAM_TRACK_SESSION_TTL_SECONDS: ${WEBCAM_TRACK_SESSION_TTL_SECONDS:-30}
      WEBCAM_TRACK_MAX_SESSIONS: ${WEBCAM_TRACK_MAX_SESSIONS:-100}
      WEBCAM_TRACK_OBSERVATION_WINDOW: ${WEBCAM_TRACK_OBSERVATION_WINDOW:-120}
      WEBCAM_TRACK_MAX_TRACKS: ${WEBCAM_TRACK_MAX_TRACKS:-64}
      WEBCAM_TRACK_STALE_FRAMES: ${WEBCAM_TRACK_STALE_FRAMES:-90}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-20971520}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-16000000}
      VIDEO_MAX_BYTES: ${VIDEO_MAX_BYTES:-104857600}
      VIDEO_MAX_DURATION_SECONDS: ${VIDEO_MAX_DURATION_SECONDS:-30}
      MODEL_STATE_PATH: ${MODEL_STATE_PATH:-/app/state/active-model.json}
    volumes:
      - ./models:/app/models:ro
      - flowlink_ai_state:/app/state
    networks:
      - flowlink
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend-video-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.video_detection_worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      OAUTH_BACKEND_BASE_URL: ${OAUTH_BACKEND_BASE_URL:?Set OAUTH_BACKEND_BASE_URL}
      UPLOAD_DIR: /app/uploads
      AI_SERVICE_URL: http://backend-ai:8001
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?Set AI_INTERNAL_API_KEY}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-30}
      AI_VIDEO_SERVICE_TIMEOUT_SECONDS: ${AI_VIDEO_SERVICE_TIMEOUT_SECONDS:-300}
      VIDEO_JOB_POLL_SECONDS: ${VIDEO_JOB_POLL_SECONDS:-1}
      VIDEO_JOB_STALE_SECONDS: ${VIDEO_JOB_STALE_SECONDS:-600}
      USER_IMAGE_SOURCE_MAX_BYTES: ${USER_IMAGE_SOURCE_MAX_BYTES:-20971520}
      USER_IMAGE_SOURCE_MAX_PIXELS: ${USER_IMAGE_SOURCE_MAX_PIXELS:-50000000}
      USER_IMAGE_NORMALIZED_MAX_EDGE: ${USER_IMAGE_NORMALIZED_MAX_EDGE:-2560}
      USER_IMAGE_NORMALIZED_TARGET_BYTES: ${USER_IMAGE_NORMALIZED_TARGET_BYTES:-4194304}
      USER_IMAGE_NORMALIZED_HARD_MAX_BYTES: ${USER_IMAGE_NORMALIZED_HARD_MAX_BYTES:-5242880}
      USER_VIDEO_MAX_BYTES: ${USER_VIDEO_MAX_BYTES:-104857600}
      USER_VIDEO_MAX_DURATION_SECONDS: ${USER_VIDEO_MAX_DURATION_SECONDS:-30}
      USER_VIDEO_MAX_SOURCE_EDGE: ${USER_VIDEO_MAX_SOURCE_EDGE:-4096}
      USER_VIDEO_NORMALIZED_MAX_WIDTH: ${USER_VIDEO_NORMALIZED_MAX_WIDTH:-1920}
      USER_VIDEO_NORMALIZED_MAX_HEIGHT: ${USER_VIDEO_NORMALIZED_MAX_HEIGHT:-1080}
      USER_VIDEO_NORMALIZED_MAX_FPS: ${USER_VIDEO_NORMALIZED_MAX_FPS:-30}
      USER_VIDEO_FFPROBE_TIMEOUT_SECONDS: ${USER_VIDEO_FFPROBE_TIMEOUT_SECONDS:-20}
      USER_VIDEO_FFMPEG_TIMEOUT_SECONDS: ${USER_VIDEO_FFMPEG_TIMEOUT_SECONDS:-180}
      USER_IMAGE_ROLLING_24H_LIMIT: ${USER_IMAGE_ROLLING_24H_LIMIT:-50}
      USER_VIDEO_ROLLING_24H_LIMIT: ${USER_VIDEO_ROLLING_24H_LIMIT:-5}
      USER_MEDIA_STORAGE_LIMIT_BYTES: ${USER_MEDIA_STORAGE_LIMIT_BYTES:-1073741824}
      USER_ACTIVE_VIDEO_JOB_LIMIT: ${USER_ACTIVE_VIDEO_JOB_LIMIT:-1}
    volumes:
      - flowlink_uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
      backend-ai:
        condition: service_healthy
    networks:
      - flowlink

networks:
  flowlink:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  flowlink_uploads:
  flowlink_ai_state:
