services:
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      flowlink:
        ipv4_address: 172.30.0.10
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    restart: unless-stopped

  backend:
    restart: unless-stopped

  backend-ai:
    restart: unless-stopped
